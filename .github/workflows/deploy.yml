name: CI / Deploy

# Runs on every push to main. Two jobs:
#   ci      — belt-and-suspenders test gate (mirrors the local pre-push hook)
#   deploy  — gated on ci; triggers Vercel + Render, then emits a commit_pushed event
#
# SETUP — add these secrets in GitHub → Settings → Secrets → Actions:
#   RENDER_DEPLOY_HOOK_URL   Render service webhook (Settings → Deploy hook)
#   VERCEL_TOKEN             Vercel personal access token
#   VERCEL_ORG_ID            Vercel team/org ID (vercel projects ls → copy orgId)
#   VERCEL_PROJECT_ID        Vercel project ID (vercel projects ls → copy id)
#   INTERNAL_API_SECRET      Shared secret for POST /api/events/internal
#   BACKEND_URL              https://ai-engineering-lab-azzp.onrender.com
#
# IMPORTANT: to avoid double deploys, disable auto-deploy on both platforms
# after adding this workflow. Vercel: Project → Settings → Git → disable.
# Render: Service → Settings → Auto-Deploy → No.

on:
  push:
    branches: [main]

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────────
  ci:
    name: Test + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build check
        working-directory: frontend
        run: npm run build

  # ── DEPLOY ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci                    # only runs when ci passes
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Render: HTTP POST to the deploy hook triggers a new build.
      # If auto-deploy is still enabled on Render this will cause a double build;
      # disable it in the Render service settings once this workflow is set up.
      - name: Trigger Render deploy
        run: |
          curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered"

      # Vercel: deploy via CLI. VERCEL_ORG_ID + VERCEL_PROJECT_ID are read from
      # env vars automatically by the CLI; no .vercel/project.json needed.
      # If auto-deploy is still enabled on Vercel this will deploy twice;
      # disable it under Project → Settings → Git → Ignored Build Step.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: frontend
        run: |
          npm install -g vercel
          vercel --token "$VERCEL_TOKEN" --prod --yes

      # Emit a commit_pushed event to the backend events table.
      # continue-on-error: the backend may be sleeping (Render free tier cold start)
      # immediately after a deploy — the event is best-effort, not load-bearing.
      - name: Emit commit_pushed event
        continue-on-error: true
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          PAYLOAD=$(jq -n \
            --arg sha     "${{ github.sha }}" \
            --arg branch  "${{ github.ref_name }}" \
            --arg msg     "${{ github.event.head_commit.message }}" \
            --arg actor   "${{ github.actor }}" \
            --arg run_id  "${{ github.run_id }}" \
            '{
              event_type: "commit_pushed",
              source: "github",
              commit_sha: $sha,
              feature_area: "infra",
              metadata: {
                branch: $branch,
                commit_message: $msg,
                actor: $actor,
                workflow_run_id: $run_id
              }
            }')

          curl -f -s -X POST "${BACKEND_URL}/api/events/internal" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Secret: ${INTERNAL_API_SECRET}" \
            -d "$PAYLOAD" \
          && echo "commit_pushed event recorded" \
          || echo "WARNING: event emission failed (backend may be sleeping — event will be missing for this deploy)"
