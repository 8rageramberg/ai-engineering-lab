services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Loads OPENAI_API_KEY (and anything else added later) from backend/.env at
    # *runtime* — never baked into the image (see backend/.dockerignore).
    # `required: false` means `docker compose up` works fine without the file;
    # the demo agent just returns a clear "no key configured" error until it's set.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
      CORS_ORIGINS: http://localhost:3000
      WORKLOG_PATH: /app/docs/worklog/ai_sessions.jsonl
      FRONTEND_URL: http://frontend:3000
    ports:
      - "8000:8000"
    volumes:
      - ./docs/worklog:/app/docs/worklog:ro
      # Read-only access to the Docker Engine API for /api/system-status's
      # per-container CPU/memory signals — see DECISIONS.md for why this is
      # an acceptable seam for a local-first portfolio app.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
